# PostgreSQL dedicado a los tests E2E (Playwright). No lo usa la app en
# desarrollo ni en producción: solo `bun run test:e2e` / `db:test:up`.
# Los tests truncan las tablas antes de cada uno (resetDb), así que el
# `db:test:down` es `stop` y no `down`: la red no se desmonta y se evita el
# fallo intermitente de netavark al recrearla (podman).
services:
  postgres-test:
    image: postgres:17-alpine
    container_name: y-tu-que-compras-e2e-db
    environment:
      POSTGRES_DB: e2e
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - '55433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d e2e']
      interval: 2s
      timeout: 5s
      retries: 10
