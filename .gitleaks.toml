# Config de gitleaks: la por defecto más excepciones puntuales documentadas.
# CI lo usa implícitamente (gitleaks lee .gitleaks.toml del raíz del repo).
[extend]
useDefault = true

# El BETTER_AUTH_SECRET de .env.test es un valor dummy de los e2e (ver la
# cabecera del propio fichero): mejor-auth exige que la variable exista, pero
# no es un secreto real y nunca lo será (la regla generic-api-key la pilla por
# Excepción ceñida al valor dummy (la regla captura el valor, no la línea),
# no al fichero entero, para no enmascarar un secreto real que caiga ahí.
[allowlist]
description = "Valores dummy de los tests e2e"
regexes = ['''e2e-test-secret-no-usar-en-produccion''']
