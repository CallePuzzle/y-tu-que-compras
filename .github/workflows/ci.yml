name: CI

on:
  pull_request:
  # El CI verde en main es lo que dispara la release (workflow_run en
  # release.yml). Los cambios solo de deploy/** (el bump de version.jsonnet y
  # los manifiestos, que Argo CD aplica sin imagen nueva) no la necesitan.
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/**'

# En una PR, un push nuevo deja obsoleto el run anterior. En main no se
# cancela (issue #122): cada merge necesita su CI completo para que la
# release sepa si desplegarlo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Solo lectura: el CI no escribe en el repo ni publica.
permissions:
  contents: read
  packages: read

jobs:
  quality:
    name: lint + check + test + build + e2e
    runs-on: ubuntu-latest
    # Postgres para el proyecto `integration` de vitest (seed de familias
    # contra el adaptador Prisma real). Los e2e llevan su propio PostgreSQL
    # (docker-compose.yml, puerto 55433): se levanta en su paso.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: y_tu_que_compras_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # El token no se queda en .git/config al alcance de dependencias y herramientas.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # Caché de paquetes de bun: evita re-descargar el registry en cada run.
      - name: Restaurar caché de bun
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Instalar dependencias
        run: bun install --frozen-lockfile
        env:
          # `@callepuzzle/*` se resuelven contra GitHub Packages (ver .npmrc).
          # GITHUB_TOKEN basta porque los paquetes tienen este repo añadido
          # en "Manage Actions access" de su configuración. Solo en este paso:
          # el resto (lint, tests, build) ejecuta código de terceros sin token.
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Los tests de componentes (vitest browser mode) y los e2e corren en Chromium.
      - name: Instalar Chromium
        run: bunx playwright install --with-deps chromium

      - name: Lint
        run: bun run lint

      - name: Check
        run: bun run check

      - name: Test unit
        run: bun run test:unit -- --run

      # Aplica las migraciones a la BD del service y corre los tests de
      # integración (adaptador Prisma real).
      - name: Test integration
        run: |
          bunx prisma migrate deploy
          bun run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/y_tu_que_compras_test

      - name: Build
        run: bun run build

      # Levanta el PostgreSQL dedicado de los e2e (docker-compose.yml, puerto
      # 55433): el globalSetup de Playwright le aplica las migraciones y el
      # webServer arranca el dev server contra él (ver playwright.config.ts).
      - name: Levantar la BD de e2e
        run: docker compose up -d postgres-test

      - name: Test e2e
        run: bun run test:e2e

  security:
    name: audit + secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Historial completo: gitleaks revisa todos los commits, no solo el último.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # Solo necesita bun.lock: no instala nada ni usa NPM_TOKEN. Los `@callepuzzle/*`
      # no se pueden auditar (GitHub Packages no responde al audit): se escanean en su repo.
      # Las excepciones y el umbral están en el script `audit` de package.json.
      - name: bun audit
        run: bun run audit

      # Binario oficial verificado por checksum (gitleaks-action pide licencia en organizaciones).
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  # Construye la imagen que publica release.yml (linux/arm64 en runner ARM
  # nativo, mismas instrucciones del Dockerfile) y la ARRANCA contra Postgres
  # (issue #123): migraciones con el CLI de Prisma como el init container
  # db-migrate, servidor de adapter-node sobre bun distroless y curl a las
  # probes. Sin esto, el runtime real solo se estrenaba en pro (la primera
  # release falló por un path de libs que solo existía en amd64; un «libssl»
  # del schema-engine solo se vería como CrashLoop). Build sin push.
  docker:
    name: build imagen linux/arm64
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ytqc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IMAGE: y-tu-que-compras:ci
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ytqc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build (sin push)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          # A la imagen local del runner, para arrancarla en los pasos siguientes.
          load: true
          tags: ${{ env.IMAGE }}
          # Mismo mecanismo que release.yml: resuelve @callepuzzle/* de GitHub Packages.
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          # Lee la caché que escribe la release en main; este job no escribe.
          cache-from: type=gha

      # Mismo comando que el init container db-migrate (deploy/lib/app.libsonnet)
      # y las mismas restricciones que su securityContext (sin capabilities ni
      # escalada; la imagen ya corre como nonroot). `--network host`: el
      # Postgres del service escucha en localhost del runner.
      - name: Migraciones con la imagen
        run: |
          docker run --rm --network host \
            --cap-drop ALL --security-opt no-new-privileges \
            -e DATABASE_URL \
            --entrypoint bun "$IMAGE" \
            run /app/node_modules/prisma/build/index.js migrate deploy

      - name: Arrancar el servidor
        run: |
          docker run -d --name ytqc --network host \
            --cap-drop ALL --security-opt no-new-privileges \
            -e DATABASE_URL \
            -e BETTER_AUTH_SECRET=ci-smoke-secret-no-usar-en-produccion-0123456789 \
            -e BETTER_AUTH_URL=http://localhost:8080 \
            -e ORIGIN=http://localhost:8080 \
            "$IMAGE"

      # /healthz: el proceso sirve. /readyz: llega a Postgres por el adaptador
      # pg (SELECT 1). /login: render SSR completo (hooks, i18n, better-auth).
      - name: Probes y una página
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz && break
            if [ "$i" = 30 ]; then
              echo "::error::El servidor no responde a /healthz tras 30s"
              exit 1
            fi
            sleep 1
          done
          echo
          curl -sf http://localhost:8080/readyz
          echo
          curl -sf -o /dev/null -w 'GET /login -> %{http_code}\n' http://localhost:8080/login

      - name: Logs del servidor
        if: always()
        run: docker logs ytqc || true
