name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Solo lectura: el CI no escribe en el repo ni publica.
permissions:
  contents: read
  packages: read

jobs:
  quality:
    name: lint + check + test + build + e2e
    runs-on: ubuntu-latest
    # Postgres solo para el proyecto `integration` de vitest (seed de familias
    # contra el adaptador Prisma real). El resto de la suite no lo toca.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: y_tu_que_compras
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # El token no se queda en .git/config al alcance de dependencias y herramientas.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      # Caché de paquetes de bun: evita re-descargar el registry en cada run.
      - name: Restaurar caché de bun
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Instalar dependencias
        run: bun install --frozen-lockfile
        env:
          # `@callepuzzle/*` se resuelven contra GitHub Packages (ver .npmrc).
          # GITHUB_TOKEN basta porque los paquetes tienen este repo añadido
          # en "Manage Actions access" de su configuración. Solo en este paso:
          # el resto (lint, tests, build) ejecuta código de terceros sin token.
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Los tests de componentes (vitest browser mode) y los e2e corren en Chromium.
      - name: Instalar Chromium
        run: bunx playwright install --with-deps chromium

      - name: Lint
        run: bun run lint

      - name: Check
        run: bun run check

      - name: Test unit
        run: bun run test:unit -- --run

      # Aplica las migraciones a la BD del service y corre los tests de
      # integración (adaptador Prisma real).
      - name: Test integration
        run: |
          bunx prisma migrate deploy
          bun run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/y_tu_que_compras

      - name: Build
        run: bun run build

      # Vuelve a construir dentro del webServer de Playwright (ver playwright.config.ts).
      - name: Test e2e
        run: bun run test:e2e

  security:
    name: audit + secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Historial completo: gitleaks revisa todos los commits, no solo el último.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      # Solo necesita bun.lock: no instala nada ni usa NPM_TOKEN. Los `@callepuzzle/*`
      # no se pueden auditar (GitHub Packages no responde al audit): se escanean en su repo.
      # Las excepciones y el umbral están en el script `audit` de package.json.
      - name: bun audit
        run: bun run audit

      # Binario oficial verificado por checksum (gitleaks-action pide licencia en organizaciones).
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
